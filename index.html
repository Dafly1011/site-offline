<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site Offline | Ward Profile Management System</title>

    <style>
        {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f6f8;
            color: #1f2937;
        }

        .offline-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;

            border-radius: 10px;
            overflow: hidden;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        .government-header {
            background: #003b70;
            padding: 30px 20px 25px;
            color: white;
        }

        .government-logo {
            width: 110px;
            max-width: 35%;
            height: auto;
            margin-bottom: 15px;
        }

        .government-name {
            margin: 0;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .government-subtitle {
            margin-top: 6px;
            font-size: 14px;
            opacity: 0.9;
        }

        .offline-content {
            padding: 45px 35px;
        }

        .offline-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 22px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fff3cd;
            color: #856404;

            font-size: 34px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 32px;
            color: #222;
        }

        .message {
            margin: 0 auto;
            max-width: 450px;

            font-size: 17px;
            line-height: 1.7;
            color: #5f6875;
        }

        .status {
            margin-top: 28px;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 9px 16px;

            border-radius: 30px;

            background: #fde8e8;
            color: #b42318;

            font-size: 14px;
            font-weight: bold;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #d92d20;
        }

        .footer {
            padding: 18px 20px;

            background: #f8fafc;

            border-top: 1px solid #e5e7eb;

            color: #6b7280;

            font-size: 13px;
        }

        @media (max-width: 500px) {

            .government-header {
                padding: 25px 15px 20px;
            }

            .government-logo {
                width: 90px;
            }

            .government-name {
                font-size: 19px;
            }

            .offline-content {
                padding: 35px 22px;
            }

            h1 {
                font-size: 28px;
            }

            .message {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="offline-container">

    <!-- Government Header -->
    <div class="government-header">

        <img
            src="wnbpg-logo.png"
            alt="West New Britain Provincial Government Logo"
            class="government-logo"
        >

        <h2 class="government-name">
            Ward Profile Management System
        </h2>

        <div class="government-subtitle">
            West New Britain Provincial Government
        </div>

    </div>


    <!-- Offline Message -->
    <div class="offline-content">

        <div class="offline-icon">
            ⚠
        </div>

        <h1>Site Offline</h1>

        <p class="message">
            This website is currently unavailable.
            Please try again later.
        </p>

        <div class="status">
            <span class="status-dot"></span>
            Currently Offline
        </div>

    </div>


    <!-- Footer -->
    <div class="footer">
        © Division of Planning, Monitoring & Coordination
    </div>

</div>

</body>
</html>
